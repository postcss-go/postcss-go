name: Go Module Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'go.mod'
      - 'pkg/api/**'
      - 'scripts/tag-go-module.mjs'
  workflow_dispatch:

concurrency: go-module-release

permissions:
  contents: write

jobs:
  tag:
    name: Tag Go module release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag and push Go module release
        run: node ./scripts/tag-go-module.mjs
