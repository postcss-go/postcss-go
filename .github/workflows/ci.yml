name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-packages:
    uses: ./.github/workflows/native.yml

  upstream-sync:
    name: Upstream PostCSS Test Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check vendored upstream tests are current
        run: node ./scripts/check-upstream-postcss-sync.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Go coverage
        run: pnpm test:coverage:go

      - name: Generate JS coverage
        run: pnpm test:coverage:js

      - name: Prepare JS lcov for Codecov
        run: node ./scripts/prepare-js-lcov-for-codecov.mjs

      - name: Upload Go coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: |
            coverage/go.out
            coverage/go.txt

      - name: Upload JS coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: js-coverage
          path: |
            packages/postcss-go/coverage/lcov.info
            packages/postcss-compat/coverage/lcov.info

      - name: Upload Go coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/go.out
          flags: go
          name: codecov-go
          disable_search: true
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}
          verbose: true

      - name: Upload JS coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/postcss-go/coverage/lcov.info,./packages/postcss-compat/coverage/lcov.info
          flags: js
          name: codecov-js
          disable_search: true
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}
          verbose: true

  checks:
    name: Format, Lint, and Build
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JS formatting
        run: pnpm format:check

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint JS
        run: pnpm lint

      - name: Vet Go
        run: go vet ./...

      - name: Build packages
        run: pnpm build

  node-tests:
    name: Node / TypeScript Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -mod=mod
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  browser-wasm:
    name: Browser WASM Smoke
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser WASM
        run: pnpm --filter @postcss-go/core test:browser-wasm

  upstream-tests:
    name: Upstream PostCSS Test Suite
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full upstream PostCSS unit suite
        run: pnpm test:upstream

      - name: Run full Go compatibility suite
        run: pnpm test:upstream:go

  go-tests:
    name: Go Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -mod=mod
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...
