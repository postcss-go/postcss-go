name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-packages:
    uses: ./.github/workflows/native.yml

  upstream-sync:
    name: Upstream PostCSS Test Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check vendored upstream tests are current
        run: node ./scripts/check-upstream-postcss-sync.mjs

  checks:
    name: Format, Lint, and Build
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Check JS formatting
        run: pnpm format:check

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(find . -name '*.go' -not -path './vendor/*' -not -path '*/node_modules/*' -exec gofmt -l {} +)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint JS
        run: pnpm lint

      - name: Vet Go
        run: go vet ./...

      - name: Check Go module path
        run: node ./scripts/check-go-module-path.mjs

      - name: Smoke test external Go module consumption
        run: node ./scripts/smoke-go-module.mjs

      - name: Build packages
        run: pnpm build

      - name: Typecheck packages
        run: pnpm check

  browser-wasm:
    name: Core CSS Contract / Browser WASM
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
      # ubuntu-latest already ships Google Chrome; reuse it instead of
      # downloading Playwright's Chromium build on every run.
      PLAYWRIGHT_CHANNEL: chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test browser WASM
        run: pnpm --filter @postcss-go/core test:browser-wasm

      - name: Test cross-surface Core CSS contract
        run: pnpm test:core-css-contract
