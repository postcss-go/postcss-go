name: CodSpeed

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for OIDC authentication with CodSpeed

jobs:
  go-benchmarks:
    name: Go Benchmarks
    # Go CodSpeed currently supports walltime only. Macro runners need a GitHub
    # organization and, for this public repo, "Allow public repositories" on
    # Organization Settings → Actions → Runner groups → Default.
    # See docs/benchmark.md ("Reading a walltime report").
    runs-on: codspeed-macro
    env:
      # `codspeed` excludes:
      # - benchmark/small_bench_test.go (*_Small / *_small)
      # - benchmark/extended_real_bench_test.go (Bulma / Pure / UIkit / Materialize)
      # The CodSpeed Go runner discovers Benchmark* from source; -bench filters
      # alone are not reliable for dropping flaky or suite-polluting benches.
      GOFLAGS: -mod=mod -tags=codspeed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime # go only supports walltime mode
          token: ${{ secrets.CODSPEED_TOKEN }}
          # CodSpeed Go runner only accepts the `-bench` flag.
          run: go test ./benchmark/ -bench=.
