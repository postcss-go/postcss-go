name: CodSpeed

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for OIDC authentication with CodSpeed

jobs:
  go-benchmarks:
    name: Go Benchmarks
    # Go CodSpeed currently supports walltime only. Personal GitHub accounts
    # cannot use `codspeed-macro`; switch to that runner once the repo is under
    # an organization with CodSpeed Macro Runners enabled. Until then, walltime
    # on ubuntu-latest is noisy ("Different runtime environments detected"):
    # GitHub hands out different CPU generations (EPYC 7763 / 9V74 / 9V45 have
    # all been observed), and the same benchmark binary can differ by more than
    # 1.5x between them. See docs/benchmark.md ("Reading a walltime report") for
    # how to tell such a report apart from a real regression.
    runs-on: ubuntu-latest
    env:
      # `codspeed` excludes:
      # - benchmark/small_bench_test.go (*_Small / *_small)
      # - benchmark/extended_real_bench_test.go (Bulma / Pure / UIkit / Materialize)
      # The CodSpeed Go runner discovers Benchmark* from source; -bench filters
      # alone are not reliable for dropping flaky or suite-polluting benches.
      GOFLAGS: -mod=mod -tags=codspeed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime # go only supports walltime mode
          token: ${{ secrets.CODSPEED_TOKEN }}
          # CodSpeed Go runner only accepts the `-bench` flag.
          run: go test ./benchmark/ -bench=.
