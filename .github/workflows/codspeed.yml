name: CodSpeed

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/codspeed.yml
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/codspeed.yml
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-benchmarks:
    name: Go Benchmarks
    # Go CodSpeed supports walltime only, and walltime needs a dedicated
    # machine: `codspeed-macro` is a 16-core ARM64 bare-metal runner, so base
    # and head are measured on identical hardware instead of on whichever CPU
    # generation a shared GitHub runner happens to allocate.
    runs-on: codspeed-macro
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    env:
      GOFLAGS: -mod=mod

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime # go only supports walltime mode
          # The CodSpeed Go runner discovers every `Benchmark*` in the package
          # and only accepts the `-bench` flag.
          run: go test ./benchmark/ -bench=.
        env:
          # Macro runners are ARM64, where frame-pointer unwinding yields more
          # reliable Go call stacks (and flame graphs) than DWARF unwinding.
          CODSPEED_PERF_UNWINDING_MODE: fp
