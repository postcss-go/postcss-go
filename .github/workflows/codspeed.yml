name: CodSpeed

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # Allows CodSpeed to trigger backtest analysis for initial baselines.
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  go-benchmarks:
    name: Go Benchmarks
    # Go CodSpeed currently supports walltime only. Personal GitHub accounts
    # cannot use `codspeed-macro`; switch to that runner once the repo is under
    # an organization with CodSpeed Macro Runners enabled.
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          token: ${{ secrets.CODSPEED_TOKEN }}
          # CodSpeed Go runner only accepts the `-bench` flag.
          run: go test ./benchmark/ -bench=.
