name: Native packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ci-${{ matrix.tuple }}-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tuple: darwin-arm64
            os: macos-15
          - tuple: darwin-x64
            os: macos-15-intel
          - tuple: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - tuple: linux-x64-gnu
            os: ubuntu-24.04
          - tuple: win32-arm64-msvc
            os: windows-11-arm
          - tuple: win32-x64-msvc
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Windows ARM64 MinGW toolchain
        if: ${{ matrix.tuple == 'win32-arm64-msvc' }}
        shell: pwsh
        run: |
          $version = "20260616"
          $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw-$version.zip"
          $install = Join-Path $env:RUNNER_TEMP "llvm-mingw-$version"
          Invoke-WebRequest `
            -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-aarch64.zip" `
            -OutFile $archive
          $expectedHash = "312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba"
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "llvm-mingw archive checksum mismatch: $actualHash"
          }
          Expand-Archive -Path $archive -DestinationPath $install
          $toolchain = Get-ChildItem -Path $install -Directory | Select-Object -First 1
          if (-not $toolchain) {
            throw "llvm-mingw archive did not contain a toolchain directory"
          }
          $bin = Join-Path $toolchain.FullName "bin"
          $cc = Join-Path $bin "aarch64-w64-mingw32-clang.exe"
          $cxx = Join-Path $bin "aarch64-w64-mingw32-clang++.exe"
          if (-not (Test-Path $cc) -or -not (Test-Path $cxx)) {
            throw "llvm-mingw ARM64 compiler is missing"
          }
          "CC=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$cxx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native package
        if: ${{ !startsWith(matrix.tuple, 'win32-') }}
        run: pnpm --filter postcss-go build

      - name: Build native package on Windows
        if: ${{ startsWith(matrix.tuple, 'win32-') }}
        shell: pwsh
        run: |
          pnpm --filter postcss-go build 2>&1 | Tee-Object -FilePath native-build.log
          if ($LASTEXITCODE -ne 0) {
            $lines = @(
              Select-String native-build.log -Pattern ': error |fatal error|LNK[0-9]{4}|unresolved external|undefined reference|cannot open|cannot find|no such file|not recognized' |
                Select-Object -First 20 |
                ForEach-Object { $_.Line }
            )
            if ($lines.Count -eq 0) {
              $lines = @(
                Select-String native-build.log -Pattern 'error|err!|fatal|LNK|undefined|cannot|failed' |
                  Select-Object -First 20 |
                  ForEach-Object { $_.Line }
              )
            }
            $lines | ForEach-Object {
              Write-Output "::error title=Native build log::$_"
            }
            exit $LASTEXITCODE
          }

      - name: Pack, install, and smoke native package
        run: node ./scripts/pack-smoke-native.mjs

      - name: Upload validated addon
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.tuple }}
          path: |
            npm/postcss-go/${{ matrix.tuple }}/postcss-go.${{ matrix.tuple }}.node
            npm/postcss-go/${{ matrix.tuple }}/libpostcssgo.dll
          if-no-files-found: error
          retention-days: 7
