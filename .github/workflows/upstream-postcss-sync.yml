name: Sync Upstream PostCSS Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync upstream test snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Sync upstream tests
        run: node ./scripts/sync-upstream-postcss-tests.mjs

      - name: Install synchronized dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck packages
        run: pnpm check

      - name: Test synchronized upstream baseline
        run: pnpm test:upstream

      - name: Test Go-backed compatibility
        run: pnpm test:upstream:go

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/sync-upstream-postcss-tests
          commit-message: 'chore: sync upstream postcss tests'
          title: 'chore: sync upstream postcss tests'
          body: |
            This PR syncs the vendored PostCSS library and tests, plus the
            compatibility harness dependencies, with `postcss/postcss@main`.

            The upstream baseline and Go-backed compatibility suites passed
            before this pull request was created.

            Generated by `.github/workflows/upstream-postcss-sync.yml`.
          delete-branch: true
