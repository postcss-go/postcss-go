name: Sync Upstream PostCSS Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync upstream test snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync upstream tests
        run: node ./scripts/sync-upstream-postcss-tests.mjs

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/sync-upstream-postcss-tests
          commit-message: 'chore: sync upstream postcss tests'
          title: 'chore: sync upstream postcss tests'
          body: |
            This PR syncs `vendor/postcss/test` with `postcss/postcss@main`.

            Generated by `.github/workflows/upstream-postcss-sync.yml`.
          delete-branch: true
