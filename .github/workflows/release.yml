name: Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.changeset/**'
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write

jobs:
  native-packages:
    uses: ./.github/workflows/native.yml

  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    needs: native-packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download validated native addons
        uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: native-artifacts

      - name: Install native addons into platform packages
        run: node ./scripts/install-native-artifacts.mjs

      - name: Snapshot validated native addons
        run: node ./scripts/check-native-artifacts.mjs snapshot "$RUNNER_TEMP/native-artifacts.json"

      - name: Build publishable JavaScript and WASM
        run: pnpm build:release

      - name: Verify validated native addons are unchanged
        run: node ./scripts/check-native-artifacts.mjs verify "$RUNNER_TEMP/native-artifacts.json"

      - name: Create release PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag Go module release
        if: steps.changesets.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node ./scripts/tag-go-module.mjs
