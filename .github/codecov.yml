codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 2

coverage:
  precision: 1
  round: down
  range: '70...90'
  status:
    project:
      default:
        informational: true
      go:
        target: 90%
        flags:
          - go
        paths:
          - 'internal/'
          - 'pkg/'
          - 'benchmark/'
          - 'cmd/'
        informational: false
      js:
        # Vitest already gates JS line coverage at 90%. Codecov treats lcov
        # BRDA records as partials, which under-counts versus Vitest lines.
        flags:
          - js
        paths:
          - 'packages/'
        informational: true
    patch:
      default:
        informational: true
      go:
        target: 90%
        flags:
          - go
        informational: false
      js:
        flags:
          - js
        informational: true

flags:
  go:
    paths:
      - 'internal/'
      - 'pkg/'
      - 'benchmark/'
      - 'cmd/'
  js:
    paths:
      - 'packages/'

ignore:
  - 'vendor/**'
  - 'coverage/**'
  - '**/coverage/**'
  - 'benchmark/fixtures/**'
  - 'packages/postcss-go/bin/**'
  - 'packages/postcss-go/native/**'
  - 'internal/nativeaddon/cabi/**'
  - 'internal/asthandle/protocol_gen.go'
  - 'internal/asthandle/cmd/genprotocol/**'
  - 'packages/postcss-go/src/cli.ts'
  - 'packages/postcss-go/src/wasm/browser.ts'
  - 'packages/postcss-go/src/config.ts'
  - 'packages/postcss-go/src/reporter.ts'
  - 'packages/postcss-go/src/types.ts'
  - 'packages/postcss-go/src/plugin-types.ts'
  - '**/*.d.ts'
  - '**/*.d.mts'

comment:
  layout: 'reach,diff,flags,tree'
  behavior: default
  require_changes: false
